<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Matrix — Admin</title>
<style>

/* ===== Same look as the current Vercel viewer ===== */
:root{
  --navy:#2D4E31; --navy2:#3E6845; --accent:#C9962C; --accent2:#E0B75A;
  --bg:#F3F7F3; --card:#ffffff; --ink:#1F2D22; --muted:#5A6B5D;
  --line:#DCE6DC; --green:#0e9f6e; --red:#e02424;
  --shadow:0 4px 18px rgba(31,45,34,.10); --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 60%,#4E7A54 100%);color:#fff;padding:0 26px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.hd{display:flex;align-items:center;gap:14px;height:62px;max-width:1400px;margin:0 auto}
.logo{height:36px;padding:4px 9px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.logo img{height:100%;width:auto;display:block}
.hd h1{font-size:17px;font-weight:700;letter-spacing:.3px}
.hd small{display:block;font-size:10.5px;font-weight:400;color:#C7D6C9;letter-spacing:1.4px;text-transform:uppercase;margin-top:1px}
.hd .spacer{flex:1}
.live{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:#C7D6C9;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);padding:5px 12px;border-radius:20px;white-space:nowrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:#98a3bd}
.live.ok .dot{background:#37d39b;animation:pulse 2s infinite}
.live.err .dot{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,211,155,.55)}70%{box-shadow:0 0 0 7px rgba(55,211,155,0)}100%{box-shadow:0 0 0 0 rgba(55,211,155,0)}}
.hbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.32);color:#fff;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.15s}
.hbtn:hover{background:rgba(255,255,255,.28)}
.lobsel{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.32);color:#fff;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer;outline:none}
.lobsel option{color:#1F2D22}
.hidden{display:none !important}

/* ---------- Login (same card style as the portal's pop-ups) ---------- */
.login-wrap{min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:#fff;border-radius:16px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.modal .mh{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:20px 24px;border-radius:16px 16px 0 0}
.modal .mh h3{font-size:17px}.modal .mh p{font-size:12px;color:#C7D6C9;margin-top:3px}
.modal .mb{padding:22px 24px}
.fl{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 5px}
.fi{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;outline:none}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,150,44,.16)}
.gold{background:linear-gradient(135deg,var(--accent),#D9A93F);color:#fff;border:none;border-radius:9px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:18px}
.gold:hover{filter:brightness(1.05)}
.lerr{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px}
.msbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 14px;border:1px solid #8c8c8c;border-radius:9px;background:#fff;color:#2f2f2f;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none}
.msbtn:hover{background:#f3f3f3}
.msbtn svg{width:20px;height:20px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px;margin:16px 0 4px}.or:before,.or:after{content:'';flex:1;height:1px;background:var(--line)}
.pwlink{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;margin-top:10px}

/* ---------- Viewer: left filters + right results ---------- */
.dl-shell{max-width:1400px;margin:0 auto;padding:22px 26px 60px}
.dl-shell>.dl-main{min-width:0}
.dl-bar{display:none}
.dl-filters{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;position:sticky;top:82px;z-index:60}
.dl-fp{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dl-fp b{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--navy)}
.dl-clearall2{background:none;border:none;color:var(--accent);font-weight:800;font-size:11px;cursor:pointer}
.dl-sec{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);font-weight:800;margin:4px 0 7px}
.dl-dd{position:relative;width:100%}
/* ---------- Filters button + horizontal, step-by-step filter bar ---------- */
.fbtn{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.fbtn:hover{background:var(--navy2)}
.fbtn .fcount{background:var(--accent);color:#fff;border-radius:20px;font-size:11px;font-weight:800;padding:1px 8px}.fbtn .fcount:empty{display:none}
.fbtn .chev{transition:transform .25s}.fbtn.open .chev{transform:rotate(180deg)}
.fbar{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;max-height:0;opacity:0;overflow:hidden;transform:translateY(-6px);transition:max-height .35s ease,opacity .25s ease,transform .25s ease;position:relative;z-index:40}
.fbar.open{max-height:900px;opacity:1;transform:none}
.fbar.shown{overflow:visible}
.fsteps{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:16px}
.fstep{width:215px;flex:0 0 auto}
.fstep.new{animation:slideIn .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.fstep .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800;margin:0 0 6px 2px;display:flex;gap:6px;align-items:center}
.fstep .lbl i{font-style:normal;background:#E7EFE7;color:var(--navy);border-radius:20px;padding:0 7px;font-size:10px}
.fstep.date{width:190px;padding-right:12px;border-right:1px dashed var(--line)}
.fhint{align-self:center;color:var(--muted);font-size:12.5px;padding:0 4px 10px}
.fhint b{color:var(--accent)}
.fbar-foot{display:flex;justify-content:flex-end;padding:0 16px 12px}
.dl-dd>button{width:100%;padding:11px 30px 11px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.dl-dd>button::after{content:'\25BE';position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px}
.dl-dd.on>button{border-color:var(--accent);color:var(--navy);font-weight:700}
.dl-dd.open>button{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,150,44,.15)}
.dl-pnl{display:none;position:absolute;top:110%;left:0;z-index:80;min-width:100%;width:max-content;max-width:min(360px,86vw);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(31,45,34,.2);max-height:320px;overflow:auto;padding:7px}
.dl-dd.open .dl-pnl{display:block}
.dl-pnl label{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:7px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.dl-pnl label:hover{background:#F0F5F0}.dl-pnl input{accent-color:var(--navy);margin-top:1px}
.dl-cl{font-size:11px;color:var(--accent);cursor:pointer;padding:6px 9px;font-weight:800}
.dl-mss{width:calc(100% - 14px);margin:2px 7px 6px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;outline:none}
.dl-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.dl-search{flex:1;min-width:200px;position:relative}
.dl-search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;outline:none;background:#fff}
.dl-search input:focus{border-color:var(--accent)}
.dl-search span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.dl-count{font-size:12.5px;color:var(--muted);font-weight:600;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px}
.dl-xls{background:#fff;border:1px solid var(--navy);color:var(--navy);font-weight:700;font-size:12.5px;border-radius:9px;padding:8px 13px;cursor:pointer}
.dl-xls:hover{background:#E7EFE7}.dl-xls:disabled{opacity:.6;cursor:wait}
.dl-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.dl-chips:empty{display:none}
.dl-chip{display:inline-flex;align-items:center;gap:7px;background:#E7EFE7;color:var(--navy);border-radius:20px;padding:4px 6px 4px 12px;font-size:12px;font-weight:600}
.dl-chip b{cursor:pointer;background:#fff;border-radius:50%;width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.dl-chip.dl-clearall{background:none;color:var(--accent);font-weight:800;cursor:pointer}
.dl-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.dl-scroll{overflow:auto;max-height:72vh}
.dl-tbl{width:100%;border-collapse:collapse;font-size:13px}
.dl-tbl thead th{position:sticky;top:0;background:var(--navy);color:#fff;text-align:left;padding:11px 13px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;white-space:nowrap;z-index:5}
.dl-tbl tbody td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top}
.dl-tbl tbody tr:nth-child(even){background:#F7FAF7}.dl-tbl tbody tr:hover{background:#F5F1E3}
.dl-rate{font-weight:800;color:var(--navy);white-space:nowrap}
.dl-k0{font-weight:700;color:var(--navy)}
.dl-still{font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px}
.dl-notes{max-width:320px;color:var(--muted);font-size:12px;line-height:1.45}
.dl-empty{padding:50px;text-align:center;color:var(--muted)}
.dl-more{text-align:center;color:var(--muted);font-size:12.5px;padding:14px}
.spin{width:30px;height:30px;border:3px solid #E7EFE7;border-top-color:var(--accent);border-radius:50%;margin:0 auto 10px;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
mark.dl-hl{background:#ffe58a;color:inherit;padding:0 1px;border-radius:3px}
footer{text-align:center;color:#93A695;font-size:12px;margin-top:26px}
@media(max-width:880px){.dl-shell{padding:14px 12px}}
@media(max-width:560px){.fstep,.fstep.date{width:100%;border-right:none;padding-right:0}.fsteps{gap:10px}}
@media(max-width:640px){
  .dl-scroll{max-height:none}
  .dl-tbl thead{display:none}.dl-tbl,.dl-tbl tbody{display:block}
  .dl-tbl tbody tr{display:block;margin:0 8px 10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .dl-tbl tbody td{display:flex;justify-content:space-between;gap:12px;text-align:right;border-bottom:1px solid #EEF3EE}
  .dl-tbl tbody td::before{content:attr(data-label);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:800;text-align:left}
  .dl-tbl tbody td.dl-k0{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;text-align:left}
  .dl-tbl tbody td.dl-k0::before{display:none}
}
@media(max-width:560px){header{padding:0 14px}.hd{gap:9px}.hd small{display:none}#liveText{display:none}}

/* ---------- admin ---------- */
.adm{max-width:1400px;margin:0 auto;padding:22px 26px 60px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 16px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:none}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.kpi b{display:block;font-size:26px;color:var(--navy)}.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--navy);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;border-bottom:1px solid var(--line);padding-top:6px}
.bars div{flex:1;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div:hover::after{content:attr(data-t);position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:11px;padding:4px 7px;border-radius:6px;white-space:nowrap;z-index:5}
.bx{display:flex;justify-content:space-between;color:var(--muted);font-size:10.5px;margin-top:4px}
.utbl{width:100%;border-collapse:collapse;font-size:13px}
.utbl th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.utbl td{padding:9px 12px;border-bottom:1px solid var(--line)}
.utbl tr:nth-child(even) td{background:#F7FAF7}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#E7EFE7;color:var(--navy)}
.pill.ms{background:#e8f1fb;color:#0b5cad}.pill.off{background:#fdecec;color:var(--red)}
.utbl select{padding:5px 7px;border:1px solid var(--line);border-radius:7px;font-size:12.5px}
.mini{background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer}
.periodsel{padding:6px 9px;border:1px solid var(--line);border-radius:8px;font-size:12.5px}
.scrollx{overflow:auto}
.addu{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;align-items:end;background:#F7FAF7;border:1px dashed var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.addu input,.addu select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.addu label{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px}
.gbtn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer}
.okmsg{background:#e2f7ee;color:#0b7a52;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
</style>
</head>

  <div><h1>Grid Matrix</h1><small>Admin</small></div>
  <div class="spacer"></div>
  <a class="hbtn" href="/" style="text-decoration:none">Open viewer</a>
  <button class="hbtn hidden" id="logout">Log out</button>
  <div class="live" id="live"><span class="dot"></span><span id="liveText">Connecting…</span></div>
</div></header>

<div class="login-wrap hidden" id="loginView"><div class="modal">
  <div class="mh"><h3>Admin sign in</h3><p>Only admins can open this page</p></div>
  <div class="mb">
    <a class="msbtn hidden" id="msbtn" href="/api/auth/m365/login?next=/admin"><svg viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>Sign in with Microsoft</a>
    <div class="or" id="orline">or with password</div>
    <label class="fl">Email</label><input class="fi" id="em" autocomplete="username">
    <label class="fl">Password</label><input class="fi" id="pw" type="password" autocomplete="current-password">
    <button class="gold" id="go">Sign in</button>
    <div class="lerr" id="lerr"></div>
  </div></div></div>

<div class="adm hidden" id="app">
  <div class="tabs">
    <span class="tab on">Users &amp; usage</span>
    <a class="tab" href="/import">Upload grid</a>
  </div>
  <div class="cards" id="cards"></div>
  <div class="panel"><h3><span>Visits per day</span><select class="periodsel" id="days"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select></h3>
    <div class="bars" id="bars"></div><div class="bx" id="bx"></div></div>
  <div class="panel"><h3><span>Users</span><span><span style="font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted);font-size:12px;margin-right:10px" id="unote"></span><button class="gbtn" id="addBtn">＋ Add user</button></span></h3>
    <div class="addu hidden" id="addForm">
      <div><label>Name</label><input id="nuName" placeholder="Full name"></div>
      <div><label>Email</label><input id="nuEmail" placeholder="name@company.com"></div>
      <div><label>Role</label><select id="nuRole"><option value="viewer">viewer</option></select></div>
      <div><label>Temporary password</label><input id="nuPw" placeholder="min 8 characters"></div>
      <div style="display:flex;gap:8px"><button class="mini" id="genPw" type="button">Generate</button><button class="gbtn" id="saveUser" type="button">Create user</button></div>
    </div>
    <div class="okmsg hidden" id="okmsg"></div>
    <div class="scrollx"><table class="utbl"><thead><tr><th>User</th><th>Sign-in</th><th>Role</th><th>Status</th><th>Last visit</th><th id="thv">Visits (30 d)</th><th>Searches (30 d)</th><th>Total visits</th><th></th></tr></thead><tbody id="ub"></tbody></table></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nf=n=>Number(n||0).toLocaleString('en-IN');
const when=t=>{if(!t)return'—';const d=new Date(t),m=Math.round((Date.now()-d)/60000);if(m<1)return'just now';if(m<60)return m+' min ago';if(m<1440)return Math.round(m/60)+' h ago';return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});};
let ME=null;
function live(t,c){$('live').className='live '+(c||'');$('liveText').textContent=t;}
async function api(p,opt){const r=await fetch(p,{credentials:'same-origin',...(opt||{})});if(r.status===401){showLogin();throw 0;}
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Failed');return d;}
function showLogin(msg){$('loginView').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden');live('Signed out');if(msg)$('lerr').textContent=msg;}
async function boot(){
  const pv=await fetch('/api/auth/providers').then(r=>r.json()).catch(()=>({}));
  if(pv.m365)$('msbtn').classList.remove('hidden');else $('orline').classList.add('hidden');
  const me=await fetch('/api/me',{credentials:'same-origin'});
  if(!me.ok)return showLogin();
  ME=(await me.json()).user;
  if(!['admin','superadmin'].includes(ME.role))return showLogin('You are signed in as '+ME.email+' (viewer). Only admins can open this page.');
  $('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');
  load();
}
async function load(){
  live('Loading…');const days=$('days').value;const d=await api('/api/admin/usage?days='+days);const s=d.summary;
  $('cards').innerHTML=[['Total users',s.users_total],['Active in 7 days',s.users_active_7d],['Active in '+days+' days',s.users_active_period],
    ['Visits today',s.visits_today],['Visits in 7 days',s.visits_7d],['Visits in '+days+' days',s.visits_period],['Searches in '+days+' days',s.hits_period]]
    .map(([k,v])=>`<div class="kpi"><b>${nf(v)}</b><span>${esc(k)}</span></div>`).join('');
  const mx=Math.max(1,...d.daily.map(x=>x.visits));
  $('bars').innerHTML=d.daily.map(x=>`<div style="height:${Math.round(x.visits/mx*100)}%" data-t="${esc(x.day)}: ${x.visits} visits · ${x.users} users"></div>`).join('');
  $('bx').innerHTML=`<span>${esc(d.daily[0].day)}</span><span>${esc(d.daily[d.daily.length-1].day)}</span>`;
  $('thv').textContent='Visits ('+days+' d)';document.querySelectorAll('.utbl th')[6].textContent='Searches ('+days+' d)';
  const sup=ME.role==='superadmin';
  $('unote').textContent=sup?'You can add users, change roles and block access':'You can add and block viewers';
  $('nuRole').innerHTML=(sup?['viewer','admin','superadmin']:['viewer']).map(r=>`<option>${r}</option>`).join('');
  $('ub').innerHTML=d.users.map(u=>`<tr>
    <td><b>${esc(u.name||u.email)}</b><div style="color:var(--muted);font-size:11.5px">${esc(u.email)}</div></td>
    <td><span class="pill ${u.auth_provider==='m365'?'ms':''}">${u.auth_provider==='m365'?'Microsoft':'Password'}</span></td>
    <td>${sup&&u.id!==ME.id?`<select data-role="${u.id}">${['viewer','admin','superadmin'].map(r=>`<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select>`:esc(u.role)}</td>
    <td>${u.active?'<span class="pill">Active</span>':'<span class="pill off">Blocked</span>'} ${(sup||u.role==='viewer')&&u.id!==ME.id?`<button class="mini" data-act="${u.id}" data-to="${u.active?0:1}">${u.active?'Block':'Allow'}</button>`:''}</td>
    <td>${when(u.last_visit)}</td><td>${nf(u.visits_period)}</td><td>${nf(u.hits_period)}</td><td>${nf(u.visits_total)}</td>
    <td>${u.has_password&&u.id!==ME.id&&(sup||u.role==='viewer')?`<button class="mini" data-reset="${u.id}" data-email="${esc(u.email)}">Reset password</button>`:''}${u.must_change?' <span class="pill" title="Has not set own password yet">temp pw</span>':''}</td></tr>`).join('');
  live('Live','ok');
}
$('ub').addEventListener('change',async e=>{const id=e.target.dataset.role;if(!id)return;
  await api('/api/users/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({role:e.target.value})});load();});
$('ub').addEventListener('click',async e=>{const id=e.target.dataset.act;if(!id)return;const to=e.target.dataset.to==='1';
  if(!to&&!confirm('Block this user from the Grid Portal?'))return;
  await api('/api/users/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({active:to})});load();});
$('days').onchange=load;
const genPw=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789',a=new Uint32Array(10);crypto.getRandomValues(a);return [...a].map(x=>c[x%c.length]).join('')+'7';};
$('addBtn').onclick=()=>{$('addForm').classList.toggle('hidden');$('okmsg').classList.add('hidden');if(!$('nuPw').value)$('nuPw').value=genPw();};
$('genPw').onclick=()=>{$('nuPw').value=genPw();};
$('saveUser').onclick=async()=>{
  try{const pw=$('nuPw').value;const u=await api('/api/users',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('nuName').value.trim(),email:$('nuEmail').value.trim(),role:$('nuRole').value,password:pw})});
    $('okmsg').innerHTML=`✓ <b>${esc(u.email)}</b> created as ${esc(u.role)}. Temporary password: <b>${esc(pw)}</b> — share it privately; they must set their own password at first sign-in.`;
    $('okmsg').classList.remove('hidden');$('addForm').classList.add('hidden');['nuName','nuEmail','nuPw'].forEach(i=>$(i).value='');load();}
  catch(e){if(e)alert(e.message);}
};
$('ub').addEventListener('click',async e=>{const id=e.target.dataset.reset;if(!id)return;
  if(!confirm('Give '+e.target.dataset.email+' a new temporary password?'))return;const pw=genPw();
  try{await api('/api/users/'+id+'/reset-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw})});
    $('okmsg').innerHTML=`✓ New temporary password for <b>${esc(e.target.dataset.email)}</b>: <b>${esc(pw)}</b> — share it privately; they must set their own password at next sign-in.`;$('okmsg').classList.remove('hidden');load();}
  catch(err){if(err)alert(err.message);}});
$('go').onclick=async()=>{$('lerr').textContent='';const r=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('em').value.trim(),password:$('pw').value})});
  const d=await r.json().catch(()=>({}));if(!r.ok){$('lerr').textContent=d.error||'Sign in failed';return;}$('pw').value='';boot();};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('go').click();};
$('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});showLogin();};
const le=new URLSearchParams(location.search).get('login_error');if(le){$('lerr').textContent=le;}
boot();
</script>
</body></html>
